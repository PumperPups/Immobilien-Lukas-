[project]
name = "tinyhaus-scout"
version = "0.1.0"
description = "Unbebaute Grundstuecke finden, bewerten und die Tiny-House-Nachfrage vor dem Kauf messen"
requires-python = ">=3.11"
dependencies = []          # bewusst nur Standardbibliothek

[project.scripts]
tinyhaus = "tinyhaus.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tinyhaus*"]
