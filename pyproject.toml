[project]
name = "hausverwaltung"
version = "0.1.0"
description = "Hausverwaltung: Stammdaten, Mieteingang und Prozesse fuer 200-300 Einheiten"
requires-python = ">=3.11"
dependencies = []          # bewusst nur Standardbibliothek

[project.scripts]
verwaltung = "verwaltung.cli:main"
tinyhaus = "tinyhaus.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["verwaltung*", "tinyhaus*"]
